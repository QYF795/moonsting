name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Maintenance mode: a weekly full check, plus a manual trigger so the job can
  # be verified without waiting for Monday.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  # Pure-logic jobs: no C toolchain, no child processes. These are the ones that
  # must never be flaky, so they run on all three platforms.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: install MoonBit (unix)
        if: runner.os != 'Windows'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: install MoonBit (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: iwr -useb https://cli.moonbitlang.com/install/powershell.ps1 | iex

      - name: add MoonBit to PATH (unix)
        if: runner.os != 'Windows'
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: add MoonBit to PATH (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH

      - name: toolchain version
        run: moon version --all

      # Warnings are errors: the repo is kept clean at --deny-warn, and CI is
      # where that promise is enforced.
      - name: check
        run: moon check --target wasm-gc --deny-warn

      - name: test (wasm-gc)
        run: moon test --target wasm-gc

      - name: test (js)
        run: moon test --target js

  # The native backend links C, and --isolate spawns child processes. Both are
  # exercised here on the two Unix runners, which ship a C compiler; Windows
  # native is verified locally (it needs MSVC, see docs/验收.md).
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: check (native)
        run: moon check --target native --deny-warn

      - name: test (native)
        run: moon test --target native

      # A crash in the target must not take the run with it. This is the one
      # behaviour that only exists on the native backend, so it gets a smoke
      # test here rather than being taken on trust.
      - name: isolation smoke test
        run: |
          moon run cli --target native -- run --target varint --max-execs 2000 --isolate --no-shrink | tail -5

      # Dogfooding: the fuzzer must stay clean on the targets that have no known
      # findings, including the standard library JSON parser. A regression in the
      # engine (a false positive, a crash of our own) fails the build here.
      - name: dogfood (no findings expected)
        run: |
          for target in json csvstrict props fixed stdjson; do
            moon run cli --target native -- run --target "$target" --max-execs 5000 --fail-on-finding
          done

  # One job that answers "is the repo still good?" — used by the weekly schedule
  # and by hand. It runs the same script a maintainer runs locally.
  healthcheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: healthcheck
        run: bash script/healthcheck.sh